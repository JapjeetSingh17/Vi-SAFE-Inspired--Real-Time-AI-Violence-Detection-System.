name: Sync to Hugging Face Spaces
on:
  push:
    branches: [main]
  # Allows manual triggering
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Push the main branch to the Hugging Face Space repository
          # Replace 'JapjeetSingh17' and 'visafe-api' with your Hugging Face username and Space name if different
          git push --force https://JapjeetSingh17:$HF_TOKEN@huggingface.co/spaces/JapjeetSingh17/visafe-api main
